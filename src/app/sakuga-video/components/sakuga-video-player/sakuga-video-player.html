@if (videoDatas$ | async) {
  <div id="commands">
    <button (click)="onBack()">Home</button>
    <a href="{{currentPost}}">Link</a>
    <button (click)="setNextVideo()">Next Video</button>
  </div>

  <div id="videocontainer">
    <video class="active" controls src="{{currentUrl}}" autoplay="autoplay" (ended)="setNextVideo()"></video>
  </div>

}
